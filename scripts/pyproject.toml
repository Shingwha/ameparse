[project]
name = "ameparse"
version = "0.5.0"
description = "Parser for .ame model files: pure-Python extraction of model structure, components, params, variables and the alias-level connection graph"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ameparse = "ameparse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ameparse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
